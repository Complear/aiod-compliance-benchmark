[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cdb"
version = "0.1.0"
description = "EU AI Act obligation-mapping engine and benchmark (reader, rule engine, scorer)"
license = "Apache-2.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["cdb"]

[tool.setuptools.package-data]
cdb = ["*.json", "*.md"]
